<!DOCTYPE html>
<html lang="en">
<head>
<title>Student Task Manager</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #0f172a;
    color: #e2e8f0;
}

/* HEADER */
header {
    background: #020617;
    color: #38bdf8;
    padding: 18px;
    text-align: center;
    font-size: 20px;
}

/* LAYOUT */
.container {
    display: flex;
    min-height: 90vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: #020617;
    padding: 20px;
    border-right: 1px solid #1e293b;
    box-sizing: border-box;
}

.sidebar h3 {
    color: #38bdf8;
}

.sidebar input,
.sidebar select,
.sidebar button {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 6px;
    border: none;
    box-sizing: border-box;
    display: block;
}

/* BUTTON */
.sidebar button {
    background: #38bdf8;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

.sidebar button:hover {
    background: #0ea5e9;
}

/* MAIN */
.main {
    flex: 1;
    padding: 25px;
}

/* MESSAGE */
#message {
    margin-bottom: 15px;
    padding: 10px;
    background: #022c22;
    color: #4ade80;
    border-radius: 5px;
    display: none;
}

/* TASK */
.task {
    background: #020617;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    border-left: 5px solid #38bdf8;
    transition: 0.2s;
}

.task:hover {
    transform: translateX(5px);
}

.task[data-subject="Math"] { border-left-color: #f59e0b; }
.task[data-subject="CS"] { border-left-color: #38bdf8; }
.task[data-subject="Physics"] { border-left-color: #a78bfa; }

/* DELETE */
.delete-btn {
    float: right;
    background: #ef4444;
    color: white;
    border: none;
    padding: 5px 8px;
    cursor: pointer;
}

@media (max-width: 700px) {
    .container {
        flex-direction: column;
    }
}
</style>

</head>

<body>

<header>
    <h2>Student Task Manager</h2>
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

    <h3>Add Task</h3>

    <input type="text" id="taskName" placeholder="Task Name">
    
    <select id="subject">
        <option value="Math">Math</option>
        <option value="CS">CS</option>
        <option value="Physics">Physics</option>
    </select>

    <input type="date" id="dueDate">

    <button onclick="addTask()">Add Task</button>

    <hr>

    <h3>Controls</h3>

    <select id="filter" onchange="filterTasks()">
        <option value="All">All</option>
        <option value="Math">Math</option>
        <option value="CS">CS</option>
        <option value="Physics">Physics</option>
    </select>

    <button onclick="sortTasks()">Sort by Date</button>
    <button onclick="loadAPI()">Load API</button>

</div>

<!-- MAIN -->
<div class="main">

    <div id="message"></div>
    <div id="taskList"></div>

</div>

</div>

<script>

let tasks = [];

// MESSAGE
function showMessage(msg){
    let m = document.getElementById("message");
    m.innerText = msg;
    m.style.display = "block";
    setTimeout(()=> m.style.display="none",2000);
}

// ADD TASK
function addTask(){
    let name = document.getElementById("taskName").value;
    let subject = document.getElementById("subject").value;
    let date = document.getElementById("dueDate").value;

    if(name === "" || date === "") return;

    tasks.push({id: Date.now(), name, subject, date});
    displayTasks(tasks);

    showMessage("Task Added ✔");

    // RESET INPUT FIELDS
    document.getElementById("taskName").value = "";
    document.getElementById("dueDate").value = "";
    document.getElementById("subject").selectedIndex = 0;
}

// DISPLAY
function displayTasks(list){
    let output = "";

    list.forEach(task=>{
        output += `
        <div class="task" data-subject="${task.subject}">
            <button class="delete-btn" onclick="deleteTask(${task.id})">X</button>
            <b>${task.name}</b><br>
            ${task.subject} | ${task.date}
        </div>`;
    });

    document.getElementById("taskList").innerHTML = 
        output || "<p>No tasks</p>";
}

// DELETE
function deleteTask(id){
    tasks = tasks.filter(t => t.id !== id);
    displayTasks(tasks);
    showMessage("Task Deleted ❌");
}

// FILTER
function filterTasks(){
    let val = document.getElementById("filter").value;

    if(val === "All") displayTasks(tasks);
    else displayTasks(tasks.filter(t => t.subject === val));
}

// SORT
function sortTasks(){
    tasks.sort((a,b)=> new Date(a.date)-new Date(b.date));
    displayTasks(tasks);
    showMessage("Tasks Sorted 📅");
}

// API
function loadAPI(){
    fetch("https://jsonplaceholder.typicode.com/todos?_limit=5")
    .then(res=>res.json())
    .then(data=>{
        data.forEach((item,i)=>{
            tasks.push({
                id: Date.now()+i,
                name: item.title,
                subject: "CS",
                date: "2026-05-0"+(i+1)
            });
        });

        displayTasks(tasks);
        showMessage("API Data Loaded 🚀");
    });
}

</script>

</body>
</html>
